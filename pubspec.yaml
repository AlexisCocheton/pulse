name: sport_match_flutter
description: "Portage Flutter de l'application React SportMatch"
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.8.1
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  firebase_storage: ^12.3.7
  firebase_messaging: ^15.1.6
  image_picker: ^1.1.2
  flutter_local_notifications: ^18.0.1
  geolocator: ^11.0.0
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo_v2.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo_v2.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/logo_v2.png

